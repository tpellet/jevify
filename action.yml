# jevify why: the line that explains a failed job, in the job summary.
#
# Usage: save the output of the step that can fail, then run this action only
# after a failure. `shell: bash` runs the step with pipefail, so the step fails
# when the build fails, not when tee succeeds.
#
#   - run: cargo test --locked 2>&1 | tee build.log
#     shell: bash
#   - if: failure()
#     uses: tpellet/jevify@main
#     with:
#       log: build.log
#       typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}   # optional; keyless without it
#       classes: compile|test|flaky|infra                     # optional; sorts the failure
#
# The action installs the latest jevify release with its shell installer when
# jevify is not on PATH (Linux and macOS runners), runs `jevify why < log`, and
# appends the line it points at, with context, to $GITHUB_STEP_SUMMARY in a
# fenced block. When no line looks like a failure (exit 3) it writes nothing;
# any other failure is a warning in the log. It never fails the job: the failed
# step already did. The log goes to the backend with best-effort redaction of
# secrets; jevify saves no local copy (--no-save).
#
# With `classes`, the action then runs `jevify fill --dry-run --context <why
# output> -- echo '@{one:CLASSES:QUESTION}'` on the lines `why` printed and
# writes the chosen class under the heading. An abstention (exit 3) writes
# nothing extra. benchmarks/why-triage.md measures the default classes and
# question on 34 failed runs.
name: jevify why
description: Point at the line that explains a failed build or test and write it to the job summary.
author: tpellet
branding:
  icon: search
  color: gray-dark
inputs:
  log:
    description: Path to a file holding the failed step's output, stdout and stderr (`2>&1 | tee build.log`).
    required: true
  typesafe-api-key:
    description: TypeSafe API key, recommended for CI. Without it jevify uses the free keyless classifier.dev tier ($0.50 per IP per UTC day, shared by everyone behind that IP), which is meant for trying jevify.
    required: false
    default: ""
  classes:
    description: Pipe-separated classes to sort the failure into after `why`, such as `compile|test|flaky|infra`. Empty skips the classification. The class appears under the heading in the job summary; an abstention writes nothing extra.
    required: false
    default: ""
  classes-question:
    description: The question the class answers, with one definition per class. The default defines `compile|test|flaky|infra`; rewrite it when the classes change, since a question without definitions abstains or misclassifies far more often (benchmarks/why-triage.md).
    required: false
    default: "the kind of CI failure these lines show. compile: the code or its dependencies fail to build, type-check, lint or resolve. test: a test runs and fails on an assertion, exception or output mismatch. flaky: a timeout, retry limit or resource bound that a rerun could pass. infra: credentials, permissions, network, downloads, workflow or bot configuration, or a security scanner"
runs:
  using: composite
  steps:
    - name: jevify why
      shell: bash
      env:
        LOG_FILE: ${{ inputs.log }}
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        CLASSES: ${{ inputs.classes }}
        CLASSES_QUESTION: ${{ inputs.classes-question }}
        JEVIFY_NO_MODIFY_PATH: "1"
        JEVIFY_DEADLINE: "120"
      run: |
        set +e
        if [ ! -f "$LOG_FILE" ]; then
          echo "::warning title=jevify why::no log file at $LOG_FILE"
          exit 0
        fi
        if ! command -v jevify >/dev/null; then
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/tpellet/jevify/releases/latest/download/jevify-installer.sh | sh
        fi
        jevify=$(command -v jevify || echo "${CARGO_HOME:-$HOME/.cargo}/bin/jevify")
        answer=$("$jevify" why --no-save < "$LOG_FILE")
        rc=$?
        if [ "$rc" -eq 0 ] && [ -n "$answer" ]; then
          class=""
          if [ -n "$CLASSES" ]; then
            why_file="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/jevify-why-$$.txt"
            printf '%s\n' "$answer" > "$why_file"
            filled=$("$jevify" fill --dry-run -q --context "$why_file" -- echo "@{one:${CLASSES}:${CLASSES_QUESTION}}" < /dev/null)
            frc=$?
            if [ "$frc" -eq 0 ]; then
              # --dry-run prints the shell-quoted command: 'echo' 'compile'
              class=${filled#\'echo\' }
              class=${class#\'}
              class=${class%\'}
            elif [ "$frc" -ne 3 ]; then
              echo "::warning title=jevify why::jevify fill exited $frc; the job summary has no class"
            fi
          fi
          {
            echo '### Why it failed'
            echo
            if [ -n "$class" ]; then
              echo "Class: **${class}**"
              echo
            fi
            echo '```text'
            printf '%s\n' "$answer"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        elif [ "$rc" -eq 4 ]; then
          echo "::warning title=jevify why::jevify exited 4 (backend unavailable or free budget spent); set typesafe-api-key, key at https://console.typesafe.ai/keys"
          {
            echo '### Why it failed'
            echo
            echo 'jevify could not classify the log: the backend was unavailable or the free budget is spent. Set the `typesafe-api-key` input; keys come from https://console.typesafe.ai/keys.'
          } >> "$GITHUB_STEP_SUMMARY"
        elif [ "$rc" -ne 3 ]; then
          echo "::warning title=jevify why::jevify exited $rc; the job summary has no cause"
        fi
        exit 0
