[package]
name = "jevify"
version = "0.14.2"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "grep for meaning: find the error in a 10,000-line log, a commit by description, the command for a task. A Unix CLI powered by Jev from TypeSafe AI; no key needed, thanks to classifier.dev."
repository = "https://github.com/tpellet/jevify"
homepage = "https://github.com/tpellet/jevify"
readme = "README.md"
keywords = ["cli", "grep", "semantic-search", "jev", "typesafe"]
categories = ["command-line-utilities"]
# Ship the program and its user docs. Everything else lives in the repo.
exclude = [
    ".beads/",
    ".claude-plugin/",
    ".github/",
    "AGENTS.md",
    "benchmarks/",
    "demo-record.sh",
    "demo.cast",
    "demo.tape",
    "docs/superpowers/",
    "evals/",
    "scripts/",
    "tests/release.rs",
]

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
directories = "6"
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
